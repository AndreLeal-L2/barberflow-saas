spring:
  datasource:
    hikari:
      maximum-pool-size: ${BARBERFLOW_DATABASE_MAX_POOL_SIZE:2}
      minimum-idle: ${BARBERFLOW_DATABASE_MIN_IDLE:0}
      connection-timeout: 10000
      validation-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 300000
  lifecycle:
    timeout-per-shutdown-phase: 25s

server:
  port: ${PORT:8080}
  shutdown: graceful

app:
  booking:
    data-retention-cron: "-"
  mail:
    outbox-poll-delay: ${BARBERFLOW_MAIL_POLL_DELAY:5000}
