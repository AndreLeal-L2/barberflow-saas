spring:
  main:
    lazy-initialization: true
  data:
    jpa:
      repositories:
        bootstrap-mode: lazy
  datasource:
    hikari:
      maximum-pool-size: ${BARBERFLOW_DATABASE_MAX_POOL_SIZE:2}
      minimum-idle: ${BARBERFLOW_DATABASE_MIN_IDLE:0}
      connection-timeout: 10000
      validation-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 300000
  mail:
    host: ${BARBERFLOW_MAIL_HOST:localhost}
    port: ${BARBERFLOW_MAIL_PORT:1025}
    username: ${BARBERFLOW_MAIL_USERNAME:}
    password: ${BARBERFLOW_MAIL_PASSWORD:}
  lifecycle:
    timeout-per-shutdown-phase: 25s

server:
  port: ${PORT:8080}
  shutdown: graceful

app:
  booking:
    data-retention-cron: "-"
  security:
    require-email-verification: ${BARBERFLOW_REQUIRE_EMAIL_VERIFICATION:false}
  mail:
    delivery: ${BARBERFLOW_MAIL_DELIVERY:log}
    from: ${BARBERFLOW_MAIL_FROM:BarberFlow <no-reply@barberflow.local>}
    outbox-poll-delay: ${BARBERFLOW_MAIL_POLL_DELAY:5000}
