spring:
  datasource:
    url: ${BARBERFLOW_DATABASE_URL}
    username: ${BARBERFLOW_DATABASE_USERNAME}
    password: ${BARBERFLOW_DATABASE_PASSWORD}
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  mail:
    host: ${BARBERFLOW_MAIL_HOST}
    port: ${BARBERFLOW_MAIL_PORT:587}
    username: ${BARBERFLOW_MAIL_USERNAME}
    password: ${BARBERFLOW_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  public-base-url: ${BARBERFLOW_PUBLIC_BASE_URL}
  security:
    csrf-cookie-secure: true
    session-cookie-secure: true
    require-email-verification: true
  mail:
    delivery: ${BARBERFLOW_MAIL_DELIVERY:smtp}
    from: ${BARBERFLOW_MAIL_FROM}
  cors:
    allowed-origins: ${BARBERFLOW_ALLOWED_ORIGINS}

logging:
  structured:
    format:
      console: logstash
