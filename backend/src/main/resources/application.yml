spring:
  application:
    name: BarberFlow API
  datasource:
    url: ${BARBERFLOW_DATABASE_URL:jdbc:postgresql://localhost:5432/barberflow}
    username: ${BARBERFLOW_DATABASE_USERNAME:barberflow}
    password: ${BARBERFLOW_DATABASE_PASSWORD:barberflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
  mail:
    host: ${BARBERFLOW_MAIL_HOST:localhost}
    port: ${BARBERFLOW_MAIL_PORT:1025}
    username: ${BARBERFLOW_MAIL_USERNAME:}
    password: ${BARBERFLOW_MAIL_PASSWORD:}

server:
  port: ${BARBERFLOW_API_PORT:8080}
  forward-headers-strategy: ${BARBERFLOW_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: BARBERFLOW_SESSION
        http-only: true
        secure: ${BARBERFLOW_COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

management:
  health:
    mail:
      enabled: ${BARBERFLOW_MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: ${BARBERFLOW_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${BARBERFLOW_SWAGGER_ENABLED:true}
    path: /swagger-ui.html

app:
  time-zone: ${BARBERFLOW_TIME_ZONE:Europe/Lisbon}
  public-base-url: ${BARBERFLOW_PUBLIC_BASE_URL:http://localhost:8081}
  security:
    csrf-cookie-secure: ${BARBERFLOW_CSRF_COOKIE_SECURE:false}
    session-cookie-secure: ${BARBERFLOW_COOKIE_SECURE:false}
    require-email-verification: ${BARBERFLOW_REQUIRE_EMAIL_VERIFICATION:false}
  mail:
    delivery: ${BARBERFLOW_MAIL_DELIVERY:log}
    from: ${BARBERFLOW_MAIL_FROM:BarberFlow <no-reply@barberflow.local>}
    outbox-poll-delay: ${BARBERFLOW_MAIL_POLL_DELAY:30000}
    resend:
      api-key: ${RESEND_API_KEY:}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}
    brevo:
      api-key: ${BREVO_API_KEY:}
      base-url: ${BREVO_BASE_URL:https://api.brevo.com/v3}
  booking:
    customer-cancellation-min-hours: ${BARBERFLOW_CANCELLATION_MIN_HOURS:2}
    personal-data-retention-days: ${BARBERFLOW_RETENTION_DAYS:365}
    data-retention-cron: ${BARBERFLOW_RETENTION_CRON:0 15 3 * * *}
  jobs:
    cron-secret: ${CRON_SECRET:}
  cors:
    allowed-origins: ${BARBERFLOW_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}
