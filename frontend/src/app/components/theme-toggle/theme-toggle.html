<div class="theme-toggle" role="group" [attr.aria-label]="'Tema do site' | translate">
  <button
    type="button"
    [class.active]="themes.theme() === 'LIGHT'"
    [attr.aria-pressed]="themes.theme() === 'LIGHT'"
    (click)="themes.setTheme('LIGHT')"
    [attr.aria-label]="'Tema claro' | translate"
    [title]="'Tema claro' | translate"
  >
    <svg lucideSun [size]="16" aria-hidden="true"></svg>
    <span>{{ 'Claro' | translate }}</span>
  </button>
  <button
    type="button"
    [class.active]="themes.theme() === 'DARK'"
    [attr.aria-pressed]="themes.theme() === 'DARK'"
    (click)="themes.setTheme('DARK')"
    [attr.aria-label]="'Tema escuro' | translate"
    [title]="'Tema escuro' | translate"
  >
    <svg lucideMoon [size]="16" aria-hidden="true"></svg>
    <span>{{ 'Escuro' | translate }}</span>
  </button>
</div>
