<header class="public-header">
  <a class="brand" routerLink="/" aria-label="BarberFlow, página inicial">
    <span class="brand-stripes" aria-hidden="true"> <i></i><i></i><i></i> </span>
    <span class="brand-name">BarberFlow</span>
  </a>

  <nav class="public-nav" aria-label="Navegação principal">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Início
    </a>
    <a routerLink="/pricing" routerLinkActive="active">Preço</a>
  </nav>

  <div class="header-actions">
    <a class="text-link" routerLink="/login">Entrar</a>
    <a class="button button-small button-primary" routerLink="/register">Começar grátis</a>
  </div>
</header>
