<header class="public-header">
  <a class="brand" routerLink="/" [attr.aria-label]="'BarberFlow, página inicial' | translate">
    <span class="brand-name" aria-hidden="true">BarberFlow</span>
  </a>

  <nav class="public-nav" [attr.aria-label]="'Navegação principal' | translate">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      {{ 'Início' | translate }}
    </a>
    <a routerLink="/pricing" routerLinkActive="active">{{ 'Preço' | translate }}</a>
  </nav>

  <div class="header-actions">
    <div class="appearance-controls">
      <app-language-switcher />
      <app-theme-toggle />
    </div>
    <a class="text-link" routerLink="/login">{{ 'Entrar' | translate }}</a>
    <a class="button button-small button-primary" routerLink="/register">{{
      'Começar grátis' | translate
    }}</a>
  </div>
</header>
