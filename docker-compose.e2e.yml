name: barberflow-e2e

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: barberflow_e2e
      POSTGRES_USER: barberflow_e2e
      POSTGRES_PASSWORD: barberflow_e2e
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barberflow_e2e -d barberflow_e2e"]
      interval: 2s
      timeout: 5s
      retries: 20
